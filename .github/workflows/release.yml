name: Build a Release

on:
  # If you push to master|main this will trigger a stable release
  push:
    branches:
      - master
      - main

  # Reusable workflow : Usually called by a `snapshot` workflow
  workflow_call:
    inputs:
      snapshot:
          description: 'Is this a snapshot build?'
          required: false
          default: false
          type: boolean

  # Manual Trigger
  workflow_dispatch:
env:
  MODULE_ID: ${{ github.event.repository.name }}
  JDK: 21
  SNAPSHOT: ${{ inputs.snapshot || false }}
  BUILD_ID: ${{ github.run_number }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  ##########################################################################################
  # Build & Publish
  ##########################################################################################
  build:
    name: Build & Publish
    needs: [ tests ]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup CommandBox
        uses: ortus-boxlang/setup-boxlang@main
        with:
          with-commandbox: true
          forgeboxAPIKey: ${{ secrets.FORGEBOX_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK }}

      - name: "Setup Environment Variables For Build Process"
        id: current_version
        run: |
          VERSION=$(jq -r '.version' box.json)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          box package set version=@build.version@+@build.number@
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi
          # master or snapshot
          echo "Github Ref is $GITHUB_REF"
          echo "BRANCH=master" >> $GITHUB_ENV
          if [ $GITHUB_REF == 'refs/heads/development' ]
          then
            echo "BRANCH=development" >> $GITHUB_ENV
          fi

      - name: Update changelog [unreleased] with latest version
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        if: env.SNAPSHOT == 'false' && env.TAG_EXISTS == 'false'
        with:
          changelogPath: ./changelog.md
          tag: v${{ env.VERSION }}

      - name: Build ${{ env.MODULE_ID }}
        run: |
          npm install -g markdownlint-cli
          markdownlint changelog.md --fix
          box install commandbox-docbox
          box task run taskfile=build/Build target=run :version=${{ env.VERSION }} :projectName=${{ env.MODULE_ID }} :buildID=${{ env.BUILD_ID }} :branch=${{ env.BRANCH }}

      - name: Commit Changelog [unreleased] with latest version
        uses: EndBug/add-and-commit@v11.0.0
        if: env.SNAPSHOT == 'false' && env.TAG_EXISTS == 'false'
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: 'Finalized changelog for v${{ env.VERSION }}'
          add: changelog.md

      - name: Tag Version
        uses: rickstaa/action-create-tag@v1.7.2
        if: env.SNAPSHOT == 'false'
        with:
          tag: "v${{ env.VERSION }}"
          force_push_tag: true
          message: "Latest Release v${{ env.VERSION }}"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MODULE_ID }}
          path: |
            .artifacts/**/*
            changelog.md

      - name: Upload API Docs for GitHub Pages
        if: env.SNAPSHOT == 'false'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/apidocs

      - name: Publish To ForgeBox
        run: |
          cd .tmp/${{ env.MODULE_ID }}
          box package set location=forgeboxStorage
          cat box.json
          box forgebox publish --force

      - name: Create Github Release
        uses: taiki-e/create-gh-release-action@v1.9.1
        continue-on-error: true
        if: env.SNAPSHOT == 'false'
        with:
          title: ${{ env.VERSION }}
          changelog: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/v${{ env.VERSION }}

      - name: Inform Slack
        if: ${{ always() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: coding
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: "Module ${{ env.MODULE_ID }} v${{ env.VERSION }} Built with ${{ job.status }}!"
          SLACK_TITLE: "ColdBox Module ${{ env.MODULE_ID }}"
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  publish_docs:
    name: Publish API Docs
    if: ${{ !inputs.snapshot }}
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy API Docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ##########################################################################################
  # Prep Next Release
  ##########################################################################################
  prep_next_release:
    name: Prep Next Release
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [ build, publish_docs ]
    permissions:
      checks: write
      pull-requests: write
      contents: write
      issues: write
    steps:
      # Checkout development
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Setup CommandBox
        uses: ortus-boxlang/setup-boxlang@main
        with:
          with-commandbox: true
          forgeboxAPIKey: ${{ secrets.FORGEBOX_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MODULE_ID }}
          path: .tmp

      # Copy the changelog to the development branch
      - name: Copy Changelog
        run: |
          cp .tmp/changelog.md changelog.md

      # Bump to next version
      - name: Bump Version
        run: |
          box bump --minor --!TagVersion

      # Commit it back to development
      - name: Commit Version Bump
        uses: EndBug/add-and-commit@v11.0.0
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: 'Version bump'
          add: |
            box.json
            changelog.md
